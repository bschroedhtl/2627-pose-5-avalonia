<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400"
     font-family="sans-serif">
  <!-- MVC (left) compared with MVVM (right), for chapter 04 "Data Binding and MVVM".
       Colors are the same role in both halves: blue = view, green = controller / view model,
       orange = model, gray = user. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #222; text-anchor: middle; }
      .name { font-size: 15px; font-weight: bold; fill: #222; text-anchor: middle; }
      .file { font-size: 11px; font-family: monospace; fill: #555; text-anchor: middle; }
      .role { font-size: 11px; fill: #555; text-anchor: middle; }
      .label { font-size: 12px; fill: #333; }
      .note { font-size: 11px; fill: #666; font-style: italic; }
      .line { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .user { fill: #f1f3f5; stroke: #868e96; }
      .view { fill: #e7f0fd; stroke: #1d63ed; }
      .logic { fill: #e6f6ea; stroke: #2f9e44; }
      .model { fill: #fff4e0; stroke: #e08a00; }
    </style>
  </defs>

  <!-- separator -->
  <line x1="390" y1="20" x2="390" y2="380" stroke="#ccc" stroke-dasharray="4 4"/>

  <!-- ===================== MVC ===================== -->
  <text class="title" x="195" y="34">MVC</text>

  <rect class="user" x="145" y="52" width="100" height="34" rx="6"/>
  <text class="name" x="195" y="74">User</text>

  <rect class="logic" x="120" y="128" width="150" height="50" rx="6"/>
  <text class="name" x="195" y="150">Controller</text>
  <text class="role" x="195" y="167">handles the request</text>

  <rect class="view" x="20" y="290" width="140" height="50" rx="6"/>
  <text class="name" x="90" y="312">View</text>
  <text class="role" x="90" y="329">renders the page</text>

  <rect class="model" x="230" y="290" width="140" height="50" rx="6"/>
  <text class="name" x="300" y="312">Model</text>
  <text class="role" x="300" y="329">data, business logic</text>

  <!-- user -> controller -->
  <path class="line" d="M 195 86 L 195 126"/>
  <text class="label" x="203" y="111">input / request</text>
  <!-- controller -> model -->
  <path class="line" d="M 235 178 L 292 288"/>
  <text class="label" x="272" y="228">updates,</text>
  <text class="label" x="272" y="243">queries</text>
  <!-- controller -> view -->
  <path class="line" d="M 155 178 L 98 288"/>
  <text class="label" x="112" y="228" text-anchor="end">selects the view,</text>
  <text class="label" x="112" y="243" text-anchor="end">passes the data</text>
  <!-- model -> view (the data handed over) -->
  <path class="line" d="M 228 315 L 162 315"/>
  <text class="label" x="195" y="362" text-anchor="middle">model data shown by the view</text>
  <text class="note" x="195" y="384" text-anchor="middle">The controller knows the view.</text>

  <!-- ===================== MVVM ===================== -->
  <text class="title" x="585" y="34">MVVM</text>

  <rect class="user" x="535" y="52" width="100" height="34" rx="6"/>
  <text class="name" x="585" y="74">User</text>

  <rect class="view" x="505" y="118" width="160" height="50" rx="6"/>
  <text class="name" x="585" y="140">View</text>
  <text class="file" x="585" y="157">MainWindow.axaml</text>

  <rect class="logic" x="505" y="220" width="160" height="50" rx="6"/>
  <text class="name" x="585" y="242">ViewModel</text>
  <text class="file" x="585" y="259">MainWindowViewModel</text>

  <rect class="model" x="505" y="322" width="160" height="50" rx="6"/>
  <text class="name" x="585" y="344">Model</text>
  <text class="file" x="585" y="361">Person</text>

  <!-- user -> view -->
  <path class="line" d="M 585 86 L 585 116"/>
  <text class="label" x="593" y="106">input</text>
  <!-- view -> view model: bindings and commands -->
  <path class="line" d="M 560 168 L 560 218"/>
  <text class="label" x="552" y="190" text-anchor="end">data binding,</text>
  <text class="label" x="552" y="205" text-anchor="end">commands</text>
  <!-- view model -> view: change notifications -->
  <path class="line" d="M 610 220 L 610 170"/>
  <text class="label" x="618" y="190">change</text>
  <text class="label" x="618" y="205">notifications</text>
  <!-- view model -> model -->
  <path class="line" d="M 585 270 L 585 320"/>
  <text class="label" x="593" y="299">uses</text>
  <text class="note" x="675" y="240">knows nothing</text>
  <text class="note" x="675" y="254">about the view</text>
</svg>
